<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · Outlook Manage</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css?v=20260729-3">
</head>
<body class="login-page">
  <main class="login-card">
    <img src="/assets/logo.svg" alt="Outlook Manage" width="56" height="56">
    <div>
      <h1>Outlook Manage</h1>
      <p>请输入管理密码以继续。</p>
    </div>
    <form id="login-form">
      <label class="field-label">访问密码
        <input id="login-password" type="password" autocomplete="current-password" autofocus required>
      </label>
      <button class="btn primary btn-lg" type="submit">登录</button>
      <p id="login-error" class="danger-text" role="alert"></p>
    </form>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const error = document.getElementById('login-error');
      error.textContent = '';
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('login-password').value }),
      });
      if (response.ok) {
        window.location.href = '/';
        return;
      }
      const data = await response.json().catch(() => ({}));
      error.textContent = data.detail || '登录失败';
    });
  </script>
</body>
</html>
